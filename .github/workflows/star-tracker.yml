name: 全网AI热门仓库（Star≥5万）

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 搜索全网 AI 仓库 Star ≥ 5万
        env:
          GH_TOKEN: ${{ secrets.STAR_TRACKER_TOKEN }}
        run: |
          echo "# 🔥 GitHub 全球 AI 热门仓库（Star ≥ 50000）" > AI_TOP50K.md
          echo "更新时间：$(date '+%Y-%m-%d %H:%M:%S')" >> AI_TOP50K.md
          echo "" >> AI_TOP50K.md
          echo "| 排名 | 仓库 | Star 数 | 简介 |" >> AI_TOP50K.md
          echo "|-----|------|---------|------|" >> AI_TOP50K.md

          gh api search/repositories \
            -q "q=(ai OR llm OR large-language-model OR generative-ai) stars:>=50000" \
            -X GET \
            --per-page 100 \
          | jq -r '
            .items[] |
            [
              .stargazers_count,
              .full_name,
              .description
            ] | @tsv
          ' | sort -nr | head -20 | awk -v rank=1 '
            {
              printf "| %d | [%s](https://github.com/%s) | %s | %s |\n",
              rank++, $2, $2, $1, substr($0, index($0,$3))
            }
          ' >> AI_TOP50K.md

      - name: 提交更新（无变化不报错）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AI_TOP50K.md
          git commit -m "更新 AI 仓库 TOP50K" || echo "✅ 无变化"
          git push || echo "✅ 跳过推送"
