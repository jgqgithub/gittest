name: GitHub 5万星热门仓库
on:
  workflow_dispatch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 拉取 5万星以上仓库
        env:
          GH_TOKEN: ${{ secrets.STAR_TRACKER_TOKEN }}
        run: |
          # 输出文件
          echo "# 🔥 GitHub 5万星以上仓库（自动排行）" > TOP_50K.md
          echo "| 排名 | 仓库 | Star | 描述 |" >> TOP_50K.md
          echo "|-----|------|------|------|" >> TOP_50K.md

          # 正确的 GitHub API 调用
          gh api "/search/repositories?q=stars:>=50000&sort=stars&order=desc&per_page=100" | \
          jq -r '
            .items[] | [
              .stargazers_count,
              .full_name,
              .description
            ] | @tsv
          ' | while IFS=$'\t' read -r star name desc; do
            echo "| $rank | $name | $star | $desc |" >> TOP_50K.md
          done

      - name: 提交
        run: |
          git add TOP_50K.md
          git commit -m "update" || true
          git push || true
