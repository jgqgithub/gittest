name: 自动统计 GitHub Star

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 统计 Star 数据
        uses: lowlighter/metrics@latest
        with:
          filename: stars.svg
          token: ${{ secrets.STAR_TRACKER_TOKEN }}
          template: repository
          repo_stars: yes
